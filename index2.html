<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.cartel{
    max-width:700px;
    width:100%;
    background:#fff;
    border:3px solid #1e88e5;
    border-radius:18px;
    padding:40px 25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h1{
    color:#1e88e5;
    font-size:clamp(2rem,5vw,3.2rem);
    margin-bottom:20px;
}

p{
    color:#333;
    font-size:clamp(1.1rem,2.8vw,1.6rem);
    line-height:1.6;
}

.contacto{
    margin-top:30px;
    font-size:clamp(1.3rem,3vw,2rem);
    font-weight:bold;
    color:#0d47a1;
}
</style>
</head>
<body>

<div class="cartel">
    <h1>¡Muchas Gracias!</h1>

    <p>
        Muchas gracias por ver el diseño.
    </p>

    <p style="margin-top:15px;">
        Por favor, para volver a verlo, póngase en contacto con <strong>SerEmprende</strong>.
    </p>

    <div class="contacto">
        📞 Cel.: 11307987
    </div>
</div>

</body>
</html>
